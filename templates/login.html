<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUREKHA – Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-header">
      <div class="brand">SURE<span>KHA</span></div>
      <div class="tagline">Housing Society Management Platform</div>
    </div>
    <div class="auth-body">
      <h2>🔐 Firm Login</h2>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}
      <form method="POST">
        <div class="form-group" style="margin-bottom:16px">
          <label>Username</label>
          <input type="text" name="username" required>
        </div>
        <div class="form-group" style="margin-bottom:12px">
          <label>Password</label>
          <input type="password" name="password" required>
        </div>
        <div style="text-align:right;margin-bottom:20px;">
          <a href="{{ url_for('auth.forgot_password') }}" style="font-size:12px;color:var(--primary);font-weight:600;text-decoration:none;">🔑 Forgot Password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;">Login →</button>
      </form>
      <div class="auth-link">
        New firm? <a href="{{ url_for('auth.register') }}">Register Here</a>
      </div>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
